<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <title id="t">Solution architecture</title>
  <desc id="d">Emails arrive in the shared mailbox. A Power Automate cloud flow orchestrates: it asks a Copilot Studio agent without tools to read the email, looks up shipments in the TMS through a read-only custom connector, applies the policy rules with templates and settings from Dataverse, and then replies automatically, prepares a draft with a Teams card, or routes to a queue. Every outcome is written to an audit log.</desc>
  <style>
    .box { fill: #ffffff; stroke: #c9d1db; stroke-width: 1.5; }
    .core { fill: #eaf1f8; stroke: #1f4e79; stroke-width: 2; }
    .agent { fill: #fff7e8; stroke: #9a5b00; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .ok { fill: #e9f6ef; stroke: #1e7b4f; stroke-width: 1.5; }
    .warn { fill: #fff4e0; stroke: #9a5b00; stroke-width: 1.5; }
    .risk { fill: #fbecea; stroke: #a3312a; stroke-width: 1.5; }
    .h { font-size: 15px; font-weight: 700; fill: #1b2430; }
    .s { font-size: 12.5px; fill: #5b6675; }
    .lbl { font-size: 12px; fill: #5b6675; }
    .ln { stroke: #5b6675; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161d25; stroke: #2a3440; }
      .core { fill: #13283d; stroke: #7fb2e5; }
      .agent { fill: #2a2214; stroke: #e0a84a; }
      .ok { fill: #12271d; stroke: #5cc28f; }
      .warn { fill: #2a2214; stroke: #e0a84a; }
      .risk { fill: #2c1715; stroke: #ef8a82; }
      .h { fill: #e6eaef; } .s, .lbl { fill: #9aa5b1; } .ln { stroke: #9aa5b1; }
      #a path { fill: #9aa5b1; }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6675"/></marker></defs>

  <rect class="box" x="20" y="185" width="150" height="80" rx="10"/>
  <text class="h" x="95" y="215" text-anchor="middle">Shared mailbox</text>
  <text class="s" x="95" y="235" text-anchor="middle">Exchange Online</text>
  <text class="s" x="95" y="252" text-anchor="middle">640 emails/day</text>

  <rect class="core" x="230" y="150" width="250" height="150" rx="12"/>
  <text class="h" x="355" y="180" text-anchor="middle">Cloud flow</text>
  <text class="s" x="355" y="198" text-anchor="middle">Power Automate · orchestrates</text>
  <text class="s" x="355" y="225" text-anchor="middle">1 screen automated mail</text>
  <text class="s" x="355" y="243" text-anchor="middle">2 look up + authorise</text>
  <text class="s" x="355" y="261" text-anchor="middle">3 policy gate: 18 rules</text>
  <text class="s" x="355" y="279" text-anchor="middle">4 template reply · audit</text>

  <rect class="agent" x="230" y="20" width="250" height="90" rx="12"/>
  <text class="h" x="355" y="50" text-anchor="middle">Copilot Studio agent</text>
  <text class="s" x="355" y="70" text-anchor="middle">reads one email → JSON</text>
  <text class="tag" x="355" y="92" text-anchor="middle" fill="#9a5b00">NO TOOLS · CANNOT SEND</text>

  <rect class="box" x="230" y="345" width="250" height="100" rx="12"/>
  <text class="h" x="355" y="375" text-anchor="middle">Dataverse</text>
  <text class="s" x="355" y="395" text-anchor="middle">templates NL · FR · EN</text>
  <text class="s" x="355" y="413" text-anchor="middle">thresholds (team lead)</text>
  <text class="s" x="355" y="431" text-anchor="middle">audit log, no email bodies</text>

  <rect class="box" x="540" y="20" width="180" height="90" rx="12"/>
  <text class="h" x="630" y="50" text-anchor="middle">TMS API</text>
  <text class="s" x="630" y="70" text-anchor="middle">custom connector</text>
  <text class="tag" x="630" y="92" text-anchor="middle" fill="#1e7b4f">READ SCOPE ONLY</text>

  <rect class="ok" x="560" y="150" width="380" height="58" rx="10"/>
  <text class="h" x="580" y="175">auto</text>
  <text class="s" x="580" y="195">template + TMS fields → reply to the sender only</text>
  <rect class="warn" x="560" y="222" width="380" height="58" rx="10"/>
  <text class="h" x="580" y="247">draft</text>
  <text class="s" x="580" y="267">Outlook draft + Teams card: send · edit · reject</text>
  <rect class="risk" x="560" y="294" width="380" height="58" rx="10"/>
  <text class="h" x="580" y="319">route</text>
  <text class="s" x="580" y="339">claims · planning · finance · security · team lead</text>

  <path class="ln" d="M170 225 H226"/>
  <path class="ln" d="M330 150 V114"/>
  <path class="ln" d="M380 112 V146"/>
  <text class="lbl" x="250" y="134">email text</text>
  <text class="lbl" x="388" y="134">JSON</text>
  <path class="ln" d="M480 185 C510 185 520 65 536 65"/>
  <path class="ln" d="M480 179 H556"/>
  <path class="ln" d="M480 251 H556"/>
  <path class="ln" d="M480 280 C520 280 530 323 556 323"/>
  <path class="ln" d="M355 300 V341"/>
  <text class="lbl" x="580" y="390">Kill switch: one setting → draft-only or off.</text>
  <text class="lbl" x="580" y="408">Every failure falls back to today's process.</text>
</svg>
