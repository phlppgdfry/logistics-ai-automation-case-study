name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests (evaluation set, model replay, replies, agent contract, API, business case, governance, procedures agent)
        run: node --test tests/*.test.mjs

      - name: Derived files, agent definition and quoted numbers match the model, the test set and the recordings
        run: |
          node scripts/build.mjs
          node scripts/export-eval-csv.mjs
          node scripts/sync-agent.mjs
          git diff --exit-code

      - name: Links
        run: python3 scripts/check-links.py
